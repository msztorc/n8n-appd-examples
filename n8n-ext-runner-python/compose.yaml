name: n8n-ext-runner-python

x-appd-environment: &appd-environment
  N8N_APPDYNAMICS_BT_NAME_TEMPLATE:
  APPDYNAMICS_AGENT_APPLICATION_NAME: ${APPDYNAMICS_AGENT_APPLICATION_NAME:?Set APPDYNAMICS_AGENT_APPLICATION_NAME in .env}
  APPDYNAMICS_AGENT_TIER_NAME: ${APPDYNAMICS_AGENT_TIER_NAME:?Set APPDYNAMICS_AGENT_TIER_NAME in .env}
  APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX: ${APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX:?Set APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX in .env}
  APPDYNAMICS_AGENT_NODE_NAME: ${APPDYNAMICS_AGENT_NODE_NAME:?Set APPDYNAMICS_AGENT_NODE_NAME in .env}
  APPDYNAMICS_AGENT_ACCOUNT_NAME: ${APPDYNAMICS_AGENT_ACCOUNT_NAME:?Set APPDYNAMICS_AGENT_ACCOUNT_NAME in .env}
  APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: ${APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY:?Set APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY in .env}
  APPDYNAMICS_CONTROLLER_HOST_NAME: ${APPDYNAMICS_CONTROLLER_HOST_NAME:?Set APPDYNAMICS_CONTROLLER_HOST_NAME in .env}
  APPDYNAMICS_CONTROLLER_PORT: ${APPDYNAMICS_CONTROLLER_PORT:?Set APPDYNAMICS_CONTROLLER_PORT in .env}
  APPDYNAMICS_CONTROLLER_SSL_ENABLED: ${APPDYNAMICS_CONTROLLER_SSL_ENABLED:?Set APPDYNAMICS_CONTROLLER_SSL_ENABLED in .env}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  appd-init:
    image: ${APPD_INIT_IMAGE:-docker.io/appdynamics/nodejs-agent:latest}
    restart: "no"
    user: "0:0"
    entrypoint: ["cp"]
    command: ["-R", "/opt/appdynamics/.", "/agent/"]
    volumes:
      - appd_agent:/agent

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      appd-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${N8N_HTTP_PORT:-5678}:5678"
    environment:
      <<: *appd-environment
      LIBC: musl
      NODE_EXTRA_CA_CERTS: /opt/certs/corporate-ca.pem
      NODE_OPTIONS: "--require /opt/appdynamics/shim.js"
      N8N_APPDYNAMICS_ENABLED: "true"
      N8N_APPDYNAMICS_CORRELATION_ENABLED: ${N8N_APPDYNAMICS_CORRELATION_ENABLED:-true}
      APPDYNAMICS_LOGGER_OUTPUT_TYPE: ${APPDYNAMICS_LOGGER_OUTPUT_TYPE:?Set APPDYNAMICS_LOGGER_OUTPUT_TYPE in .env}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: "120"
      N8N_PYTHON_ENABLED: "true"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HTTP_PORT:-5678}/
      N8N_WEBHOOK_URL: http://localhost:${N8N_HTTP_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
      - appd_agent:/opt/appdynamics:ro
      - ./shim.js:/opt/appdynamics/shim.js:ro
      - ./task-instrumentation.js:/opt/n8n-appdynamics/task-instrumentation.js:ro
      - ./certs/corporate-ca.pem:/opt/certs/corporate-ca.pem:ro
    networks:
      - database
      - runners
    healthcheck:
      test:
        - CMD
        - /usr/bin/env
        - NODE_OPTIONS=
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  task-runners:
    image: n8n-python-runner:${N8N_VERSION:-2.45.5}-appd26.7.2
    platform: linux/amd64
    build:
      context: .
      args:
        N8N_VERSION: ${N8N_VERSION:-2.45.5}
    command: ["python"]
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *appd-environment
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "0"
      N8N_RUNNERS_CONFIG_PATH: /etc/n8n-task-runners.json
      APPDYNAMICS_AGENT_REUSE_NODE_NAME: ${APPDYNAMICS_AGENT_REUSE_NODE_NAME:?Set APPDYNAMICS_AGENT_REUSE_NODE_NAME in .env}
      APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX: ${N8N_APPDYNAMICS_TASK_RUNNER_REUSE_NODE_NAME_PREFIX:-${APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX}}
      APPDYNAMICS_AGENT_TIER_NAME: ${N8N_APPDYNAMICS_TASK_RUNNER_TIER_NAME:-${APPDYNAMICS_AGENT_TIER_NAME}}
      APPDYNAMICS_CONTROLLER_SSL_CERTFILE: ${APPDYNAMICS_CONTROLLER_SSL_CERTFILE:?Set APPDYNAMICS_CONTROLLER_SSL_CERTFILE in .env}
      APPDYNAMICS_TCP_COMM_HOST: ${APPDYNAMICS_TCP_COMM_HOST:?Set APPDYNAMICS_TCP_COMM_HOST in .env}
      APPDYNAMICS_TCP_COMM_PORT: ${APPDYNAMICS_TCP_COMM_PORT:?Set APPDYNAMICS_TCP_COMM_PORT in .env}
      APPDYNAMICS_LOGS_DIR: ${APPDYNAMICS_LOGS_DIR:?Set APPDYNAMICS_LOGS_DIR in .env}
      APPDYNAMICS_LOGGING_LEVEL: ${APPDYNAMICS_LOGGING_LEVEL:?Set APPDYNAMICS_LOGGING_LEVEL in .env}
      TZ: Europe/Berlin
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
      - ./certs/corporate-ca.pem:${APPDYNAMICS_CONTROLLER_SSL_CERTFILE:?Set APPDYNAMICS_CONTROLLER_SSL_CERTFILE in .env}:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runners
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -I
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5680/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  appd-proxy:
    image: ${APPD_PYTHON_PROXY_IMAGE:-docker.io/appdynamics/dl-proxy:26.7.2}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      task-runners:
        condition: service_started
    network_mode: service:task-runners
    environment:
      APPDYNAMICS_TCP_COMM_HOST: ${APPDYNAMICS_TCP_COMM_HOST:?Set APPDYNAMICS_TCP_COMM_HOST in .env}
      APPDYNAMICS_TCP_COMM_PORT: ${APPDYNAMICS_TCP_COMM_PORT:?Set APPDYNAMICS_TCP_COMM_PORT in .env}
      APPDYNAMICS_TCP_PORT_RANGE: ${APPDYNAMICS_TCP_PORT_RANGE:?Set APPDYNAMICS_TCP_PORT_RANGE in .env}
      APPDYNAMICS_LOGGING_LEVEL: ${APPDYNAMICS_LOGGING_LEVEL:?Set APPDYNAMICS_LOGGING_LEVEL in .env}
    volumes:
      - ./certs/corporate-ca.pem:${APPDYNAMICS_CONTROLLER_SSL_CERTFILE:?Set APPDYNAMICS_CONTROLLER_SSL_CERTFILE in .env}:ro

networks:
  database:
    internal: true
  runners:

volumes:
  postgres_data:
  n8n_data:
  appd_agent:
