name: n8n-simple

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  appd-init:
    image: ${APPD_INIT_IMAGE:-docker.io/appdynamics/nodejs-agent:latest}
    restart: "no"
    user: "0:0"
    entrypoint: ["cp"]
    command: ["-R", "/opt/appdynamics/.", "/agent/"]
    volumes:
      - appd_agent:/agent


  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      appd-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${N8N_HTTP_PORT:-5678}:5678"
    environment:
      NODE_OPTIONS: "--require /opt/appdynamics/shim.js"
      NODE_EXTRA_CA_CERTS: /opt/certs/corporate-ca.pem
      # Disabling diagnostics/telemtry for n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Optional runner instrumentation: also enable the custom shim mount below.
      # Local compatibility test only: run trusted workflows/code.
      # N8N_APPDYNAMICS_INTERNAL_RUNNER_ENABLED: "true"
      # N8N_APPDYNAMICS_TASK_RUNNER_REUSE_NODE_NAME_PREFIX: ${N8N_APPDYNAMICS_TASK_RUNNER_REUSE_NODE_NAME_PREFIX:-}
      # N8N_APPDYNAMICS_TASK_RUNNER_TIER_NAME: ${N8N_APPDYNAMICS_TASK_RUNNER_TIER_NAME:-}
      # N8N_RUNNERS_INSECURE_MODE: "true"

      LIBC: musl

      APPDYNAMICS_AGENT_APPLICATION_NAME: ${APPDYNAMICS_AGENT_APPLICATION_NAME:?Set APPDYNAMICS_AGENT_APPLICATION_NAME in .env}
      APPDYNAMICS_AGENT_TIER_NAME: ${APPDYNAMICS_AGENT_TIER_NAME:?Set APPDYNAMICS_AGENT_TIER_NAME in .env}
      APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX: ${APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX:?Set APPDYNAMICS_AGENT_REUSE_NODE_NAME_PREFIX in .env}
      APPDYNAMICS_AGENT_NODE_NAME: ${APPDYNAMICS_AGENT_NODE_NAME:?Set APPDYNAMICS_AGENT_NODE_NAME in .env}
      APPDYNAMICS_AGENT_ACCOUNT_NAME: ${APPDYNAMICS_AGENT_ACCOUNT_NAME:?Set APPDYNAMICS_AGENT_ACCOUNT_NAME in .env}
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: ${APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY:?Set APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY in .env}
      APPDYNAMICS_CONTROLLER_HOST_NAME: ${APPDYNAMICS_CONTROLLER_HOST_NAME:?Set APPDYNAMICS_CONTROLLER_HOST_NAME in .env}
      APPDYNAMICS_CONTROLLER_PORT: ${APPDYNAMICS_CONTROLLER_PORT:?Set APPDYNAMICS_CONTROLLER_PORT in .env}
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: ${APPDYNAMICS_CONTROLLER_SSL_ENABLED:?Set APPDYNAMICS_CONTROLLER_SSL_ENABLED in .env}
      APPDYNAMICS_LOGGER_OUTPUT_TYPE: ${APPDYNAMICS_LOGGER_OUTPUT_TYPE:?Set APPDYNAMICS_LOGGER_OUTPUT_TYPE in .env}

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HTTP_PORT:-5678}/
      WEBHOOK_URL: http://localhost:${N8N_HTTP_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - appd_agent:/opt/appdynamics:ro
      # - ./shim.js:/opt/appdynamics/shim.js:ro
      - ./certs/corporate-ca.pem:/opt/certs/corporate-ca.pem:ro
      

volumes:
  postgres_data:
  n8n_data:
  appd_agent:
